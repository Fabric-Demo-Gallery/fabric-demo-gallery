[project]
name = "delivery-note-extraction-backend"
version = "0.1.0"
description = "Backend for the delivery note extraction demo"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.1",
    "azure-monitor-opentelemetry>=1.6.0",
    "fastapi>=0.115.0",
    "openai>=2.6.0",
    "opentelemetry-instrumentation-openai-v2>=2.0b0",
    "pillow>=11.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.1",
    "pypdfium2>=4.30.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "ruff>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delivery_note_extraction"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
