[project]
name = "demand-portfolio-planning-backend"
version = "0.1.0"
description = "Backend for the demand-portfolio-planning agent demo"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-foundry>=1.0.1",
    "aiohttp>=3.12.15",
    "azure-identity>=1.25.1",
    "azure-monitor-opentelemetry>=1.6.0",
    "opentelemetry-instrumentation-openai-v2>=2.0b0",
    "fastapi>=0.115.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.1",
    "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_portfolio_planning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.14.0",
    "mypy>=1.13.0",
]
